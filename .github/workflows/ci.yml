name: Windows Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Bootstrap and build application outputs
        shell: cmd
        run: build.bat /s

      - name: Verify required Windows outputs
        shell: pwsh
        run: |
          $required = @(
            'out/main/index.js',
            'out/preload/index.js',
            'out/renderer/index.html',
            'out/session-host/host.cjs',
            'out/main/codex-relay.js'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required build output is missing: $path"
            }
          }

      - name: Upload safe build evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.run_id }}-${{ github.sha }}
          path: |
            out/main/index.js
            out/preload/index.js
            out/renderer/index.html
            out/session-host/host.cjs
            out/main/codex-relay.js
          if-no-files-found: warn
          retention-days: 7
