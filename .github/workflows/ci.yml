name: Windows Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build application outputs
        run: npm run build

      - name: Verify required Windows outputs
        shell: pwsh
        run: |
          $required = @(
            'out/main/index.js',
            'out/preload/index.js',
            'out/renderer/index.html',
            'out/session-host/host.cjs',
            'out/main/codex-relay.js'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required build output is missing: $path"
            }
          }
