name: Windows package smoke

# Manual-only packaging smoke test for the Windows target:
# proves that the supported Squirrel.Windows package is produced from a clean checkout on
# windows-latest, whose runner image supplies the native build prerequisites.
#
# BUILD ONLY — this workflow must NEVER publish. `dist:win` passes `--publish never`, nothing
# here uploads to the update feed or creates a release, and the produced installer is unsigned.
# The installer is intentionally unsigned. Automatic updates are not claimed by this smoke test.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package (unsigned Squirrel.Windows, never published)
        run: npm run dist:win

      - name: Verify expected artifacts
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'dist/squirrel-windows'
          $setup = @(Get-ChildItem -LiteralPath $dir -Filter '*-Setup.exe' -File)
          $full = @(Get-ChildItem -LiteralPath $dir -Filter '*-full.nupkg' -File)
          $releases = Join-Path $dir 'RELEASES'
          if ($setup.Count -ne 1) { throw 'Expected exactly one Squirrel.Windows Setup.exe.' }
          if ($full.Count -ne 1) { throw 'Expected exactly one full Squirrel.Windows nupkg.' }
          if (-not (Test-Path -LiteralPath $releases)) { throw 'Expected Squirrel.Windows RELEASES.' }
          $index = Get-Content -LiteralPath $releases -Raw
          if ($index -notmatch [regex]::Escape($full[0].Name)) { throw 'RELEASES does not reference the full package.' }
          if ((Get-AuthenticodeSignature -LiteralPath $setup[0].FullName).Status -ne 'NotSigned') {
            throw 'The Windows installer must remain unsigned.'
          }
